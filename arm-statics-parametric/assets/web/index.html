<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数化机械臂静力学校核</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#f3f5f8;color:#172335;max-width:1200px;margin:32px auto;padding:0 20px}h1{font-size:28px;margin:0}p{color:#526076}header{margin-bottom:24px}.panel{background:white;border:1px solid #d7dee8;border-radius:12px;padding:20px;margin:16px 0}textarea{box-sizing:border-box;width:100%;height:420px;border:1px solid #b9c4d3;border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,monospace}button,select{padding:9px 14px;margin:6px 6px 6px 0;border:1px solid #b6c3d5;border-radius:7px;background:white;cursor:pointer}button.primary{background:#1e5bda;color:white;border-color:#1e5bda}button:disabled{opacity:.5;cursor:default}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #dde3ec;text-align:left}th{background:#eef3fb}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.status{font-weight:600}details{margin-top:12px}.muted{font-size:13px;color:#536277}.error{color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}}input[type=file]{max-width:230px}</style></head>
<body><header><h1>机械臂静力学校核</h1><p>无需 URDF。标准输入或简易输入 → 逐关节保持载荷 → 姿态搜索 → 静态驱动需求。</p></header>
<div class="grid"><section class="panel"><label>示例 <select id="example"><option value="worksheet-minimal.jsonc">带注释精简输入 · 七轴 3.612 kg</option><option value="simple-two-link">简易输入 · 两连杆</option><option value="standard-two-link">标准输入 · 两连杆</option><option value="seven-axis-concept">简易输入 · 七轴概念臂</option><option value="project-right-arm">标准输入 · 项目右臂</option><option value="prismatic">标准输入 · 移动关节</option></select></label><button id="load">加载示例</button><input id="file" type="file" accept=".json,.jsonc,application/json,application/jsonc"><textarea id="input" aria-label="静力学请求 JSON"></textarea><button class="primary" id="run">运行校核</button><button id="cancel" disabled>取消</button><p class="muted">支持 JSON / JSONC（// 和 /* */ 注释，不支持尾逗号）。单位：m、kg、rad、N、Nm。简易输入默认连杆沿局部 +X、质心在中点，结果中会列出这些假设。计算在独立 Worker 中执行。</p></section>
<section class="panel"><div id="status" class="status" role="status">加载输入后运行</div><p class="muted">结果仅适用于已检查工况。搜索结果未证明全局最坏值；未进行碰撞、温升或结构强度验证。</p><div style="overflow:auto"><table><thead><tr><th>关节</th><th>单位</th><th>最大绝对值</th><th>需求</th><th>判定</th></tr></thead><tbody id="summary"></tbody></table></div><button id="json" disabled>下载完整 JSON</button><button id="csv" disabled>下载汇总 CSV</button><button id="report" disabled>下载分析报告</button><details open><summary>输入假设及限制</summary><pre id="warnings"></pre></details><details><summary>临界姿态与逐项贡献</summary><pre id="details"></pre></details></section></div>
<script type="module">
import{parseRequestText}from'../../scripts/lib/input-text.mjs';
import{analyzeInWorker}from'./adapter.mjs';import{summaryCSV,reportMarkdown}from'../../scripts/lib/statics.mjs';
const $=s=>document.getElementById(s);let current,controller;
async function load(){const r=await fetch('../examples/'+$('example').value+($('example').value.endsWith('.jsonc')?'':'.json'));if(!r.ok)throw Error('示例加载失败');$('input').value=await r.text();}
$('load').onclick=()=>load().catch(showError);$('file').onchange=async e=>{try{$('input').value=await e.target.files[0].text();}catch(e){showError(e);}};
function showError(e){$('status').textContent=e.message;$('status').className='status error';}
function downloads(enabled){for(const k of['json','csv','report'])$(k).disabled=!enabled;}
$('run').onclick=async()=>{current=null;downloads(false);$('summary').replaceChildren();$('warnings').textContent='';$('details').textContent='';try{const input=parseRequestText($('input').value);controller=new AbortController();$('run').disabled=true;$('cancel').disabled=false;$('status').className='status';$('status').textContent='计算中…';const r=await analyzeInWorker(input,{signal:controller.signal});current=r;const labels={not_sized:'待选型',exceeds_capacity:'超限',satisfies_checked_cases:'已检查工况满足',capacity_conditions_unknown:'能力条件待确认'};for(const s of r.summary){const row=document.createElement('tr');for(const v of[s.joint,s.unit,s.max_abs_checked.toFixed(6),s.required_output.toFixed(6),labels[s.status]]){const c=document.createElement('td');c.textContent=v;row.append(c);}$('summary').append(row);}$('warnings').textContent=r.warnings.join('\n');$('details').textContent=JSON.stringify({critical_poses:r.summary.map(s=>({joint:s.joint,pose:s.critical_pose})),poses:r.poses},null,2);$('status').textContent='完成 · 内核 '+r.engine_version+' · SHA-256 '+r.input_sha256.slice(0,12);downloads(true);}catch(e){showError(e);}finally{$('run').disabled=false;$('cancel').disabled=true;}};
$('cancel').onclick=()=>controller?.abort();
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('json').onclick=()=>download('statics_result.json',JSON.stringify(current,null,2),'application/json');$('csv').onclick=()=>download('joint_summary.csv',summaryCSV(current),'text/csv;charset=utf-8');$('report').onclick=()=>download('statics_report.md',reportMarkdown(current),'text/markdown;charset=utf-8');load().catch(showError);
</script></body></html>
